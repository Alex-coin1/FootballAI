<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="80%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#030710"/>
    </radialGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  
  <!-- Outer Cyber Hex Ring (Football + Tech) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="4" stroke-dasharray="80 30 140 40" filter="url(#neonGlow)"/>

  <!-- Neural AI Nodes Orbit -->
  <circle cx="106" cy="200" r="7" fill="#22d3ee"/>
  <circle cx="406" cy="200" r="7" fill="#22d3ee"/>
  <circle cx="256" cy="76" r="7" fill="#f59e0b"/>
  <circle cx="256" cy="436" r="7" fill="#0ea5e9"/>
  <line x1="106" y1="200" x2="200" y2="200" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="406" y1="200" x2="312" y2="200" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="256" y1="76" x2="256" y2="140" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Central Football Pentagon AI Core -->
  <polygon points="256,150 326,200 300,282 212,282 186,200" fill="#0b1329" stroke="url(#cyanBlueGrad)" stroke-width="6"/>
  
  <!-- AI Neural Circuit Traces on Core -->
  <line x1="256" y1="150" x2="256" y2="100" stroke="url(#cyanBlueGrad)" stroke-width="4"/>
  <line x1="326" y1="200" x2="380" y2="220" stroke="url(#cyanBlueGrad)" stroke-width="4"/>
  <line x1="186" y1="200" x2="132" y2="220" stroke="url(#cyanBlueGrad)" stroke-width="4"/>
  <line x1="300" y1="282" x2="340" y2="340" stroke="url(#cyanBlueGrad)" stroke-width="4"/>
  <line x1="212" y1="282" x2="172" y2="340" stroke="url(#cyanBlueGrad)" stroke-width="4"/>

  <!-- AI Brain / Football Panels Geometry -->
  <polygon points="256,195 292,220 278,260 234,260 220,220" fill="url(#cyanBlueGrad)" opacity="0.9"/>
  <circle cx="256" cy="227" r="14" fill="#ffffff" filter="url(#neonGlow)"/>

  <!-- Accent Energy Sparks (Gold) -->
  <circle cx="256" cy="100" r="5" fill="#f59e0b"/>
  <circle cx="380" cy="220" r="5" fill="#f59e0b"/>
  <circle cx="132" cy="220" r="5" fill="#f59e0b"/>
  <circle cx="340" cy="340" r="5" fill="#f59e0b"/>
  <circle cx="172" cy="340" r="5" fill="#f59e0b"/>

  <!-- FAI Monogram Text Base -->
  <text x="256" y="395" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="8">
    FOOTBALL<tspan fill="#22d3ee">AI</tspan>
  </text>
  <text x="256" y="422" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#f59e0b" letter-spacing="4">
    FAI PROTOCOL
  </text>
</svg>
